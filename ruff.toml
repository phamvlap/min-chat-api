target-version = "py313"
line-length = 100
indent-width = 4

# Exclude a variety of commonly ignored directories.
exclude = [
    "migrations",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "DJ",     # flake8-django
    "DTZ",    # flake8-datetimez
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RET",    # flake8-return
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]
ignore = [
    "ARG002", # unused argument
    "RUF012", # mutable default argument
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in argument defaults
    "TRY003", # long messages outside exception class
    "DJ001",  # nullable string-based field (Django)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/migrations/*.py" = ["E501", "DJ", "RUF"]
"*/tests/*.py" = ["ARG", "S101"]
"manage.py" = ["T20"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.isort]
known-first-party = ["base", "config", "modules", "services", "templates", "utils"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
