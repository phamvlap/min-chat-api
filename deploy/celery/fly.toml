app = "mini-chat-celery"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "5s"

[processes]
  worker = "/app/.venv/bin/celery -A config worker --loglevel=INFO"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings"
  PYTHONPATH = "/app"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
